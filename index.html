<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 및 태블릿 화면 비율 고정, 확대 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>진드기 예방 운세 뽑기</title>
    
    <style>
        /* 외부 폰트 없이 태블릿 기본 고딕체 사용 (오프라인 완벽 대응) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* 스크롤 완전 방지 */
            user-select: none; /* 텍스트 선택 방지 */
            -webkit-user-select: none;
        }

        /* 전체 레이아웃 틀 (가로형에 맞게 가로폭 최대 활용) */
        #app {
            width: 100%;
            max-width: 95vw; 
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: clamp(10px, 2vh, 20px);
            box-sizing: border-box;
            text-align: center;
            position: relative;
            overflow: hidden; 
        }

        /* 상단 네비게이션 버튼들 */
        .home-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #4b5563;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 각 화면 공통 스타일 */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: min-content;
            padding: 1vh 0;
        }

        /* 화면 숨기기 용도 */
        .hidden {
            display: none !important;
        }

        /* 텍스트 크기 (vh를 적극 활용하여 가로 화면에서 세로 넘침 방지) */
        .title {
            font-size: clamp(2.5rem, 7vh, 4.5rem);
            font-weight: bold;
            color: #b91c1c;
            margin-bottom: clamp(1rem, 2vh, 2rem);
            line-height: 1.3;
            word-break: keep-all;
        }
        
        .subtitle {
            font-size: clamp(1.2rem, 3.5vh, 2.2rem);
            color: #374151;
            margin-bottom: clamp(1.5rem, 4vh, 3rem);
            font-weight: bold;
        }

        /* 버튼 기본 스타일 */
        .btn {
            border: none;
            border-radius: 9999px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background-color: #dc2626;
            font-size: clamp(2rem, 6vh, 3.5rem);
            padding: clamp(1.5rem, 3vh, 2.5rem) clamp(3rem, 5vh, 5rem);
        }

        .btn-next {
            background-color: #2563eb;
            font-size: clamp(1.5rem, 4vh, 2.5rem);
            padding: clamp(1rem, 2vh, 1.5rem) clamp(2rem, 4vh, 4rem);
            margin-top: clamp(1rem, 2vh, 2rem);
        }

        /* 달력(생년월일) 입력 UI 스타일 */
        .date-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: clamp(1rem, 2vh, 2rem);
            width: 100%;
            max-width: 900px;
        }
        
        .date-part {
            flex: 1;
            font-size: clamp(1.2rem, 3vh, 2.2rem);
            padding: clamp(8px, 1.5vh, 15px) 5px;
            background-color: #ffffff;
            border: 3px solid #e5e7eb;
            border-radius: 15px;
            color: #9ca3af;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .date-part.active {
            border-color: #dc2626;
            color: #dc2626;
            background-color: #fef2f2;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.2);
        }
        
        .date-grid {
            display: grid;
            gap: clamp(5px, 1vh, 10px);
            width: 100%;
            background: white;
            padding: clamp(10px, 2vh, 20px);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            align-content: start;
        }
        
        /* 년도 그리드 (12칸 배치) */
        .grid-years {
            grid-template-columns: repeat(12, 1fr); 
            max-height: 70vh; /* 잘리지 않도록 높이 제한을 여유 있게 늘림 */
            overflow-y: auto; /* 만약을 대비해 넘치면 스크롤되도록 설정 */
            -ms-overflow-style: none; /* 인터넷 익스플로러 스크롤바 숨김 */
            scrollbar-width: none; /* 파이어폭스 스크롤바 숨김 */
        }
        
        /* 크롬, 사파리 스크롤바 숨김 (깔끔한 화면 유지) */
        .grid-years::-webkit-scrollbar {
            display: none;
        }
        
        /* 월 그리드 (6칸 2줄) */
        .grid-months {
            grid-template-columns: repeat(6, 1fr); 
        }
        
        /* 일 그리드 (7칸 5줄) */
        .grid-days {
            grid-template-columns: repeat(7, 1fr); 
        }
        
        .grid-btn {
            font-family: inherit;
            /* 7줄이 화면에 다 들어오도록 글씨와 여백 크기를 아주 살짝만 줄임 */
            font-size: clamp(1rem, 2.6vh, 1.8rem);
            padding: clamp(4px, 1.2vh, 10px) 0;
            border: 2px solid #f3f4f6;
            border-radius: 10px;
            background-color: #f9fafb;
            color: #1f2937;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        
        .grid-btn:active {
            background-color: #fee2e2;
        }
        
        .grid-btn.selected {
            background-color: #dc2626;
            color: white;
            border-color: #dc2626;
        }

        /* 결과 박스 레이아웃 (좌우 나란히 배치) */
        .result-container {
            display: flex;
            flex-direction: row; 
            gap: 2vw;
            width: 100%;
            height: 65vh; 
            margin-bottom: 2vh;
        }

        .result-box {
            border-radius: 25px;
            padding: clamp(1rem, 3vh, 2.5rem);
            width: 100%;
            flex: 1; /* 가로 공간을 반반씩 차지 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
            margin-bottom: 0;
        }

        /* 운세 박스 (노란색) */
        .fortune-box {
            background-color: #ffffff;
            border: 5px solid #eab308;
        }

        .fortune-title {
            font-size: clamp(1.5rem, 4vh, 2.8rem);
            color: #ca8a04;
            font-weight: bold;
            margin-bottom: clamp(0.5rem, 2vh, 1.5rem);
        }

        .fortune-text {
            font-size: clamp(1.5rem, 5vh, 3.2rem);
            font-weight: 900;
            color: #111827;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 예방수칙 박스 (빨간색) */
        .rule-box {
            background-color: #fef2f2;
            border: 5px solid #ef4444;
        }

        .rule-text {
            font-size: clamp(1.5rem, 4.5vh, 3rem);
            font-weight: bold;
            color: #7f1d1d;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 애니메이션 효과 */
        .float {
            animation: float 3s ease-in-out infinite;
            font-size: clamp(6rem, 18vh, 12rem);
            margin: 2vh 0;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both infinite;
            font-size: clamp(5rem, 15vh, 10rem);
            margin: 2vh 0;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-5deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(5deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-10deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(10deg); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1.5s; }
        
        #btn-draw {
            margin-top: 3vh;
        }
    </style>
</head>
<body>
    
    <div id="app">
        <!-- 네비게이션 버튼 -->
        <button class="home-btn" onclick="resetScreen()">🏠 처음으로</button>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">🖥️ 전체화면</button>

        <!-- Screen 0: 시작 화면 (대문) -->
        <div id="screen-intro" class="screen">
            <div class="title" style="font-size: clamp(3rem, 9vh, 5.5rem); margin-bottom: 0;">진드기 예방</div>
            <div class="title" style="font-size: clamp(3.5rem, 11vh, 6.5rem); color: #111827;">건강 운세 뽑기</div>
            <div class="float">🧧</div>
            <div class="subtitle">나의 생년월일로 알아보는<br>오늘의 건강 비결과 운세!</div>
            <button class="btn btn-start" onclick="goToDateSelection()">
                시작하기 👆
            </button>
        </div>

        <!-- Screen 1: 정보 입력 (달력 UI) -->
        <div id="screen-date" class="screen hidden">
            <div class="title">어르신, 생년월일을<br>선택해 주세요!</div>
            
            <div class="date-display">
                <div id="tab-year" class="date-part active" onclick="openTab('year')">년도 선택</div>
                <div id="tab-month" class="date-part" onclick="openTab('month')">월 선택</div>
                <div id="tab-day" class="date-part" onclick="openTab('day')">일 선택</div>
            </div>

            <!-- 년도 그리드 (1920 ~ 1995) -->
            <div id="grid-years" class="date-grid grid-years"></div>
            
            <!-- 월 그리드 (1 ~ 12) -->
            <div id="grid-months" class="date-grid grid-months hidden"></div>
            
            <!-- 일 그리드 (1 ~ 31) -->
            <div id="grid-days" class="date-grid grid-days hidden"></div>

            <button id="btn-draw" class="btn btn-start hidden" onclick="startDraw()">
                운세 뽑기! 🎯
            </button>
        </div>

        <!-- Screen 2: 뽑는 중 (애니메이션) -->
        <div id="screen-loading" class="screen hidden">
            <div class="title">운세를<br>뽑고 있습니다...</div>
            <div class="shake">🧧</div>
        </div>

        <!-- Screen 3: 결과 화면 -->
        <div id="screen-result" class="screen hidden">
            
            <div class="result-container">
                <!-- 운세 섹션 (노란색 박스) -->
                <div class="result-box fortune-box fade-in">
                    <div id="fortune-grade" class="fortune-title">🍀 오늘의 운세 🍀</div>
                    <div id="fortune-text" class="fortune-text">
                        <!-- 운세 내용 -->
                    </div>
                </div>

                <!-- 예방수칙 섹션 (빨간색 박스) -->
                <div class="result-box rule-box fade-in delay-1">
                    <div id="rule-text" class="rule-text">
                        <!-- 안전비결 내용 -->
                    </div>
                </div>
            </div>

            <button onclick="resetScreen()" class="btn btn-next fade-in delay-2">
                다음 사람 뽑기 🔄
            </button>
        </div>
    </div>

    <script>
        // 25종 진드기 예방 운세 데이터 (어르신 맞춤형 덕담 & 일상 야외활동 위주)
        const fortunes = [
            { text: "외출할 때 챙 넓은 모자를 단디 쓰면 머리가 맑아지고 큰 복이 들어옵니다!", secret: "💡 안전비결: 챙 넓은 모자로 햇볕과 진드기 차단" },
            { text: "팔에 토시를 덧대어 차면 온갖 잡귀가 침범하지 못해 만사가 평안합니다!", secret: "💡 안전비결: 야외활동 시 긴소매나 토시 착용하기" },
            { text: "맨발이 보이지 않게 편안한 운동화를 신으면 발걸음이 가벼워지고 귀인을 만납니다!", secret: "💡 안전비결: 슬리퍼 말고 맨살이 안 보이는 운동화 신기" },
            { text: "바짓단을 양말 안으로 쏙 넣으면 재물이 밖으로 새어나가지 않고 차곡차곡 쌓입니다!", secret: "💡 안전비결: 바짓단 양말 속에 넣어 진드기 침투 차단" },
            { text: "산책 전 기피제를 칙칙 뿌리면 나쁜 기운과 액운이 십 리 밖으로 달아납니다!", secret: "💡 안전비결: 옷과 신발에 해충 기피제 뿌리기" },
            { text: "풀밭에 앉을 때 돗자리를 펴고 쉬어가시면 피로가 풀리고 복이 넝쿨째 굴러옵니다!", secret: "💡 안전비결: 풀밭 위에 바로 앉지 말고 돗자리 사용하기" },
            { text: "밝은색 옷을 입고 나들이를 가면 얼굴에 화색이 돌고 집안에 경사가 생깁니다!", secret: "💡 안전비결: 진드기가 잘 보이는 밝은색 옷 입기" },
            { text: "정해진 산책로를 따라 반듯하게 걸으면 인생의 막힌 길이 뻥 뚫리고 대통합니다!", secret: "💡 안전비결: 풀숲에 들어가지 말고 지정된 산책로 이용하기" },
            { text: "외출 후 집에 돌아와 시원하게 샤워를 하시면 몸에 묻은 액운이 말끔히 씻겨 나갑니다!", secret: "💡 안전비결: 귀가 즉시 몸을 깨끗하게 씻기" },
            { text: "입었던 옷을 마당에서 훌훌 털어 세탁기에 쏙 넣으면 집안에 상서로운 기운이 돕니다!", secret: "💡 안전비결: 외출복은 털어서 귀가 즉시 단독 세탁하기" },
            { text: "놀란 마음에 맨손으로 섣불리 건드리지 않고 차분히 대처하시면 흉한 기운이 스며들지 않아 만수무강하십니다!", secret: "💡 안전비결: 진드기를 발견해도 당황하여 맨손으로 떼지 말고 꼭 병원 가기" },
            { text: "외출 후 가방이나 모자를 밖에서 훌훌 털면 나쁜 기운도 함께 멀리 날아갑니다!", secret: "💡 안전비결: 야외활동 후 가방, 모자 등 용품 잘 털기" },
            { text: "산행 후 겨드랑이나 무릎 뒤를 꼼꼼히 살피면 숨어있던 작은 근심까지 미리 막을 수 있습니다!", secret: "💡 안전비결: 샤워할 때 진드기가 물린 곳이 없는지 꼼꼼히 확인하기" },
            { text: "풀밭에 옷을 벗어두지 않고 잘 챙기면 잃어버렸던 소중한 인연이 다시 찾아옵니다!", secret: "💡 안전비결: 돗자리 밖 풀밭에 겉옷을 벗어두지 않기" },
            { text: "휴식할 때 풀숲이 아닌 벤치에 앉으면 마음이 안정되고 가정에 웃음꽃이 핍니다!", secret: "💡 안전비결: 쉴 때는 풀밭 대신 의자나 벤치 이용하기" },
            { text: "텃밭을 가꿀 때 작업복을 꼼꼼히 갖춰 입으면 땅의 좋은 기운을 받아 건강해집니다!", secret: "💡 안전비결: 텃밭 가꿀 때 전용 작업복 꼭 챙겨 입기" },
            { text: "나들이 갈 때 진드기 예방수칙을 이웃에게 널리 알리면 덕이 쌓여 자손이 번창합니다!", secret: "💡 안전비결: 주변 사람들에게도 진드기 예방법 알려주기" },
            { text: "기피제는 정해진 시간마다 한 번 더 뿌려주면 복록이 끊이지 않고 계속 이어집니다!", secret: "💡 안전비결: 기피제는 3~4시간마다 다시 뿌려주기" },
            { text: "야외에서 용변을 볼 때 으슥한 풀숲을 피하면 뜻밖의 봉변을 면하고 평안을 유지합니다!", secret: "💡 안전비결: 으슥한 풀숲에서 용변 보지 않기" },
            { text: "반려견과 산책 후 빗질을 꼼꼼히 해주면 집안에 우환이 사라지고 평화가 찾아옵니다!", secret: "💡 안전비결: 반려동물 산책 후 털에 진드기가 붙었는지 확인하기" },
            { text: "등산 갈 때 반바지 대신 긴바지를 입으면 험난한 고비를 무사히 넘기고 정상에 오릅니다!", secret: "💡 안전비결: 등산이나 야외활동 시 반드시 긴바지 착용" },
            { text: "사용한 돗자리는 햇볕에 바짝 말려 보관하면 집안에 눅눅한 기운이 사라지고 맑은 기운이 가득 찹니다!", secret: "💡 안전비결: 사용한 돗자리는 세척 후 햇볕에 말리기" },
            { text: "야외에서 밤을 줍거나 나물을 캘 때 장갑을 꼭 끼면 재물이 손에 척척 달라붙습니다!", secret: "💡 안전비결: 산나물 채취 시 맨손 노출 방지, 장갑 착용" },
            { text: "외출복과 일상복을 섞지 않고 따로 보관하면 인간관계가 깔끔해지고 오해가 풀립니다!", secret: "💡 안전비결: 야외활동복과 평상복 분리해서 보관 및 세탁하기" },
            { text: "몸에 열이 나거나 아플 때 참지 않고 의원을 찾아가면 큰 화를 면하고 천수를 누립니다!", secret: "💡 안전비결: 야외활동 후 감기 증상(열, 설사 등) 시 병원 진료" }
        ];

        /* 중복 방지 (주머니 알고리즘) */
        let fortuneBag = [];
        let lastFortuneIndex = -1;

        function getNextFortune() {
            if (fortuneBag.length === 0) {
                for (let i = 0; i < fortunes.length; i++) {
                    fortuneBag.push(i);
                }
                for (let i = fortuneBag.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [fortuneBag[i], fortuneBag[j]] = [fortuneBag[j], fortuneBag[i]];
                }
                if (fortuneBag[0] === lastFortuneIndex) {
                    fortuneBag.push(fortuneBag.shift());
                }
            }
            const selectedIndex = fortuneBag.shift();
            lastFortuneIndex = selectedIndex;
            return fortunes[selectedIndex];
        }

        // --- 생년월일 달력 로직 ---
        let sYear = null, sMonth = null, sDay = null;
        let drawTimeout; // 뽑기 애니메이션 제어용 타이머 변수

        function initDateUI() {
            // 년도 버튼 생성 (1920 ~ 1995)
            const yearGrid = document.getElementById('grid-years');
            yearGrid.innerHTML = '';
            for(let i = 1920; i <= 1995; i++) {
                yearGrid.innerHTML += `<button class="grid-btn" onclick="selectYear(${i}, this)">${i}</button>`;
            }

            // 월 버튼 생성 (1 ~ 12월)
            const monthGrid = document.getElementById('grid-months');
            monthGrid.innerHTML = '';
            for(let i = 1; i <= 12; i++) {
                monthGrid.innerHTML += `<button class="grid-btn" onclick="selectMonth(${i}, this)">${i}월</button>`;
            }

            // 일 버튼 생성 (1 ~ 31일)
            const dayGrid = document.getElementById('grid-days');
            dayGrid.innerHTML = '';
            for(let i = 1; i <= 31; i++) {
                dayGrid.innerHTML += `<button class="grid-btn" onclick="selectDay(${i}, this)">${i}일</button>`;
            }
        }

        function openTab(tab) {
            document.getElementById('grid-years').classList.add('hidden');
            document.getElementById('grid-months').classList.add('hidden');
            document.getElementById('grid-days').classList.add('hidden');
            
            document.getElementById('tab-year').classList.remove('active');
            document.getElementById('tab-month').classList.remove('active');
            document.getElementById('tab-day').classList.remove('active');

            if(tab === 'year') {
                document.getElementById('grid-years').classList.remove('hidden');
                document.getElementById('tab-year').classList.add('active');
            } else if (tab === 'month') {
                document.getElementById('grid-months').classList.remove('hidden');
                document.getElementById('tab-month').classList.add('active');
            } else if (tab === 'day') {
                document.getElementById('grid-days').classList.remove('hidden');
                document.getElementById('tab-day').classList.add('active');
            }
        }

        function selectYear(y, btn) {
            sYear = y;
            document.getElementById('tab-year').innerText = y + '년';
            updateSelection('grid-years', btn);
            openTab('month'); 
            checkAllSelected();
        }

        function selectMonth(m, btn) {
            sMonth = m;
            document.getElementById('tab-month').innerText = m + '월';
            updateSelection('grid-months', btn);
            openTab('day'); 
            checkAllSelected();
        }

        function selectDay(d, btn) {
            sDay = d;
            document.getElementById('tab-day').innerText = d + '일';
            updateSelection('grid-days', btn);
            checkAllSelected();
        }

        function updateSelection(containerId, activeBtn) {
            const btns = document.getElementById(containerId).getElementsByTagName('button');
            for(let btn of btns) {
                btn.classList.remove('selected');
            }
            activeBtn.classList.add('selected');
        }

        function checkAllSelected() {
            if(sYear && sMonth && sDay) {
                document.getElementById('btn-draw').classList.remove('hidden');
            }
        }

        // 시작화면에서 달력화면으로 넘어가기
        function goToDateSelection() {
            openTab('year');
            showScreen('screen-date');
        }

        // 화면 전환 헬퍼 함수
        function showScreen(screenId) {
            const intro = document.getElementById('screen-intro');
            if(intro) intro.classList.add('hidden');

            document.getElementById('screen-date').classList.add('hidden');
            document.getElementById('screen-loading').classList.add('hidden');
            document.getElementById('screen-result').classList.add('hidden');
            
            document.getElementById(screenId).classList.remove('hidden');
        }

        // 운세 뽑기 시작
        function startDraw() {
            showScreen('screen-loading');
            
            // 타이머를 변수에 저장해두어, 언제든 중간에 취소할 수 있게 합니다.
            drawTimeout = setTimeout(() => {
                showResult();
            }, 2500); 
        }

        // 결과 화면 표시
        function showResult() {
            const result = getNextFortune();
            
            document.getElementById('fortune-grade').innerText = `🍀 ${sYear}년생 오늘의 운세 🍀`;
            document.getElementById('fortune-text').innerText = result.text;
            document.getElementById('rule-text').innerText = result.secret;

            // 다시 그릴 때마다 애니메이션이 재시동 되도록 트릭 사용
            const fBox = document.querySelector('.fortune-box');
            const rBox = document.querySelector('.rule-box');
            const nextBtn = document.querySelector('.btn-next');
            
            fBox.style.animation = 'none';
            rBox.style.animation = 'none';
            nextBtn.style.animation = 'none';
            
            fBox.offsetHeight; /* 리플로우 강제 발생 */
            
            fBox.style.animation = '';
            rBox.style.animation = '';
            nextBtn.style.animation = '';

            showScreen('screen-result');
        }

        // 초기 화면으로 리셋 (처음으로 버튼 누를 때도 실행됨)
        function resetScreen() {
            // 뽑는 중이었다면 해당 예약을 취소 (화면 꼬임 방지)
            clearTimeout(drawTimeout);

            sYear = null; sMonth = null; sDay = null;
            document.getElementById('tab-year').innerText = '년도 선택';
            document.getElementById('tab-month').innerText = '월 선택';
            document.getElementById('tab-day').innerText = '일 선택';
            
            const allBtns = document.getElementsByClassName('grid-btn');
            for(let btn of allBtns) btn.classList.remove('selected');

            document.getElementById('btn-draw').classList.add('hidden');
            
            showScreen('screen-intro');
        }

        // 전체화면 토글 기능
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 앱 시작 시 달력 생성
        window.onload = function() {
            initDateUI();
            showScreen('screen-intro');
        }
    </script>
</body>
</html>
