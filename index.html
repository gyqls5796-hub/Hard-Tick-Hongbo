<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 및 태블릿 화면 비율 고정, 확대 방지 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>진드기 예방 운세 뽑기</title>
    
    <style>
        /* 외부 폰트 없이 태블릿 기본 고딕체 사용 (오프라인 완벽 대응) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* 스크롤 완전 방지 */
            user-select: none; /* 텍스트 선택 방지 */
            -webkit-user-select: none;
        }

        /* 전체 레이아웃 틀 (가로형에 맞게 가로폭 최대 활용) */
        #app {
            width: 100%;
            max-width: 95vw; 
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: clamp(10px, 2vh, 20px);
            box-sizing: border-box;
            text-align: center;
            position: relative;
            overflow: hidden; 
        }

        /* 상단 네비게이션 버튼들 */
        .home-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #374151;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #4b5563;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 각 화면 공통 스타일 */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: min-content;
            padding: 1vh 0;
        }

        /* 화면 숨기기 용도 */
        .hidden {
            display: none !important;
        }

        /* 텍스트 크기 (vh를 적극 활용하여 가로 화면에서 세로 넘침 방지) */
        .title {
            font-size: clamp(2.5rem, 7vh, 4.5rem);
            font-weight: bold;
            color: #b91c1c;
            margin-bottom: clamp(1rem, 2vh, 2rem);
            line-height: 1.3;
            word-break: keep-all;
        }
        
        .subtitle {
            font-size: clamp(1.2rem, 3.5vh, 2.2rem);
            color: #374151;
            margin-bottom: clamp(1.5rem, 4vh, 3rem);
            font-weight: bold;
        }

        /* 버튼 기본 스타일 */
        .btn {
            border: none;
            border-radius: 9999px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
        }
        
        .btn:active {
            transform: scale(0.95);
        }

        .btn-start {
            background-color: #dc2626;
            font-size: clamp(2rem, 6vh, 3.5rem);
            padding: clamp(1.5rem, 3vh, 2.5rem) clamp(3rem, 5vh, 5rem);
        }

        .btn-next {
            background-color: #2563eb;
            font-size: clamp(1.5rem, 4vh, 2.5rem);
            padding: clamp(1rem, 2vh, 1.5rem) clamp(2rem, 4vh, 4rem);
            margin-top: clamp(1rem, 2vh, 2rem);
        }

        /* 달력(생년월일) 입력 UI 스타일 */
        .date-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: clamp(1rem, 2vh, 2rem);
            width: 100%;
            max-width: 900px;
        }
        
        .date-part {
            flex: 1;
            /* 상단 년/월/일 탭 글씨 크기 대폭 확대 */
            font-size: clamp(1.5rem, 4vh, 2.5rem);
            padding: clamp(10px, 2vh, 20px) 5px;
            background-color: #ffffff;
            border: 3px solid #e5e7eb;
            border-radius: 15px;
            color: #9ca3af;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .date-part.active {
            border-color: #dc2626;
            color: #dc2626;
            background-color: #fef2f2;
            box-shadow: 0 4px 10px rgba(220, 38, 38, 0.2);
        }
        
        .date-grid {
            display: grid;
            gap: clamp(5px, 1vh, 10px);
            width: 100%;
            background: white;
            padding: clamp(10px, 2vh, 20px);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
            align-content: start;
        }
        
        /* 년도 그리드 (12칸 배치) */
        .grid-years {
            grid-template-columns: repeat(12, 1fr); 
            max-height: 70vh; /* 잘리지 않도록 높이 제한을 여유 있게 늘림 */
            overflow-y: auto; /* 만약을 대비해 넘치면 스크롤되도록 설정 */
            -ms-overflow-style: none; /* 인터넷 익스플로러 스크롤바 숨김 */
            scrollbar-width: none; /* 파이어폭스 스크롤바 숨김 */
        }
        
        /* 크롬, 사파리 스크롤바 숨김 (깔끔한 화면 유지) */
        .grid-years::-webkit-scrollbar {
            display: none;
        }
        
        /* 월 그리드 (6칸 2줄) */
        .grid-months {
            grid-template-columns: repeat(6, 1fr); 
        }
        
        /* 일 그리드 (7칸 5줄) */
        .grid-days {
            grid-template-columns: repeat(7, 1fr); 
        }
        
        .grid-btn {
            font-family: inherit;
            /* 어르신들을 위해 달력 숫자 글씨 크기 대폭 확대 */
            font-size: clamp(1.4rem, 4vh, 2.5rem);
            padding: clamp(8px, 1.5vh, 15px) 0;
            border: 2px solid #f3f4f6;
            border-radius: 10px;
            background-color: #f9fafb;
            color: #1f2937;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.1s;
        }
        
        .grid-btn:active {
            background-color: #fee2e2;
        }
        
        .grid-btn.selected {
            background-color: #dc2626;
            color: white;
            border-color: #dc2626;
        }

        /* 결과 박스 레이아웃 (좌우 나란히 배치) */
        .result-container {
            display: flex;
            flex-direction: row; 
            gap: 2vw;
            width: 100%;
            height: 65vh; 
            margin-bottom: 2vh;
        }

        .result-box {
            border-radius: 25px;
            padding: clamp(1rem, 3vh, 2.5rem);
            width: 100%;
            flex: 1; /* 가로 공간을 반반씩 차지 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
            margin-bottom: 0;
        }

        /* 운세 박스 (노란색) */
        .fortune-box {
            background-color: #ffffff;
            border: 5px solid #eab308;
        }

        .fortune-title {
            font-size: clamp(1.5rem, 4vh, 2.8rem);
            color: #ca8a04;
            font-weight: bold;
            margin-bottom: clamp(0.5rem, 2vh, 1.5rem);
        }

        .fortune-text {
            font-size: clamp(1.5rem, 5vh, 3.2rem);
            font-weight: 900;
            color: #111827;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 예방수칙 박스 (빨간색) */
        .rule-box {
            background-color: #fef2f2;
            border: 5px solid #ef4444;
        }

        .rule-text {
            font-size: clamp(1.5rem, 4.5vh, 3rem);
            font-weight: bold;
            color: #7f1d1d;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 애니메이션 효과 */
        .float {
            animation: float 3s ease-in-out infinite;
            font-size: clamp(6rem, 18vh, 12rem);
            margin: 2vh 0;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both infinite;
            font-size: clamp(5rem, 15vh, 10rem);
            margin: 2vh 0;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0) rotate(-5deg); }
            20%, 80% { transform: translate3d(4px, 0, 0) rotate(5deg); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0) rotate(-10deg); }
            40%, 60% { transform: translate3d(8px, 0, 0) rotate(10deg); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1.5s; }
        
        #btn-draw {
            margin-top: 3vh;
        }
    </style>
</head>
<body>
    
    <div id="app">
        <!-- 네비게이션 버튼 -->
        <button class="home-btn" onclick="resetScreen()">🏠 처음으로</button>
        <button class="fullscreen-btn" onclick="toggleFullScreen()">🖥️ 전체화면</button>

        <!-- Screen 0: 시작 화면 (대문) -->
        <div id="screen-intro" class="screen">
            <div class="title" style="font-size: clamp(3rem, 9vh, 5.5rem); margin-bottom: 0;">진드기 예방</div>
            <div class="title" style="font-size: clamp(3.5rem, 11vh, 6.5rem); color: #111827;">건강 운세 뽑기</div>
            <div class="float">🧧</div>
            <div class="subtitle">나의 생년월일로 알아보는<br>오늘의 건강 비결과 운세!</div>
            <button class="btn btn-start" onclick="goToDateSelection()">
