<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>진드기 예방 & 오늘의 운세</title>
    <style>
        /* 기본 설정 (태블릿 최적화 및 폰트 설정) */
        body {
            margin: 0;
            padding: 0;
            /* 와이파이 없이도 예쁘게 나오는 기기 기본 폰트 적용 */
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', 'Noto Sans KR', sans-serif;
            background-color: #FDF6E3; /* 전통 한지 느낌의 따뜻한 배경색 */
            touch-action: pan-y; /* 모바일/태블릿에서 확대 축소 방지용 */
            user-select: none; /* 글씨 드래그 방지 */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh; /* 모바일 브라우저 주소창 고려한 동적 높이 */
            overflow: hidden;
        }

        /* 전체 레이아웃 틀 */
        #app {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: clamp(15px, 3vh, 30px); /* 화면 크기에 따라 여백 자동 조절 */
            box-sizing: border-box;
            text-align: center;
            overflow-y: auto; /* 화면이 작아 내용이 넘치면 스크롤 허용하여 잘림 방지 */
            overflow-x: hidden;
        }

        /* 각 화면 공통 스타일 */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            min-height: min-content; /* 내용물이 컨테이너 밖으로 빠져나가는 것 방지 */
            padding: 2vh 0;
        }

        /* 숨기기 클래스 */
        .hidden {
            display: none !important;
        }

        /* 제목 및 텍스트 스타일 */
        .title {
            font-size: clamp(2.5rem, 6vw, 4.5rem); /* 최소 2.5rem, 최대 4.5rem 자동조절 */
            font-weight: bold;
            color: #b91c1c; /* 진한 빨간색 */
            margin-bottom: clamp(1rem, 3vh, 2rem);
            line-height: 1.3;
            word-break: keep-all;
        }
        
        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            color: #374151; /* 진한 회색 */
            margin-bottom: clamp(2rem, 5vh, 4rem);
        }

        /* 버튼 스타일 */
        .btn {
            border: none;
            border-radius: 9999px; /* 완전 둥글게 */
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s;
        }
        
        .btn:active {
            transform: scale(0.95); /* 눌렀을 때 살짝 작아지는 효과 */
        }

        .btn-start {
            background-color: #dc2626;
            font-size: clamp(2rem, 5vw, 3.5rem);
            padding: clamp(1.5rem, 3vh, 2.5rem) clamp(3rem, 6vw, 5rem);
        }

        .btn-next {
            background-color: #2563eb;
            font-size: clamp(1.5rem, 3.5vw, 2.5rem);
            padding: clamp(1rem, 2vh, 1.5rem) clamp(2rem, 4vw, 4rem);
            margin-top: clamp(1rem, 2vh, 2rem);
        }

        /* 결과 박스 공통 */
        .result-box {
            border-radius: 25px;
            padding: clamp(1.5rem, 3vh, 2.5rem);
            margin-bottom: clamp(1rem, 2vh, 2rem);
            width: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        /* 운세 박스 */
        .fortune-box {
            background-color: #ffffff;
            border: 5px solid #eab308; /* 노란색 테두리 */
        }

        .fortune-title {
            font-size: clamp(1.8rem, 4vw, 3rem);
            color: #ca8a04;
            font-weight: bold;
            margin-bottom: clamp(0.5rem, 2vh, 1.5rem);
        }

        .fortune-text {
            font-size: clamp(1.8rem, 4.5vw, 3.5rem);
            font-weight: 900;
            color: #111827;
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 예방수칙 박스 */
        .rule-box {
            background-color: #fef2f2; /* 아주 연한 빨간색 */
            border: 5px solid #ef4444; /* 빨간색 테두리 */
        }

        .rule-text {
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: bold;
            color: #7f1d1d; /* 진한 빨간색 */
            line-height: 1.4;
            word-break: keep-all;
        }

        /* 애니메이션 효과 */
        .shake-animation {
            font-size: clamp(5rem, 10vw, 8rem);
            margin-bottom: 2rem;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in-out forwards;
            opacity: 0; /* 처음엔 안 보이게 */
        }

        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .loading-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: #1f2937;
        }

        /* 전체화면 버튼 스타일 (진행요원용) */
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.1);
            border: none;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 1.2rem;
            color: #374151;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
        }
        
        .fullscreen-btn:active {
            background-color: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <div id="app">
        
        <!-- Screen 1: 시작 화면 -->
        <div id="screen-start" class="screen fade-in">
            <!-- 전체화면 토글 버튼 추가 -->
            <button onclick="toggleFullScreen()" class="fullscreen-btn">🖥️ 전체화면</button>

            <h1 class="title">오늘의 운세 뽑고!<br>진드기 예방하고!</h1>
            <p class="subtitle">버튼을 눌러 오늘의 운세를 확인해보세요.</p>
            <button onclick="startDrawing()" class="btn btn-start">운세 뽑기 🎯</button>
        </div>

        <!-- Screen 2: 뽑는 중 애니메이션 화면 -->
        <div id="screen-loading" class="screen hidden">
            <div class="shake-animation">🥠</div>
            <h2 class="loading-text">운세를 뽑는 중입니다...</h2>
        </div>

        <!-- Screen 3: 결과 화면 -->
        <div id="screen-result" class="screen hidden">
            
            <!-- 운세 섹션 -->
            <div class="result-box fortune-box fade-in">
                <div id="fortune-grade" class="fortune-title">🍀 오늘의 운세 🍀</div>
                <div id="fortune-text" class="fortune-text">
                    <!-- 운세 내용이 들어갑니다 -->
                </div>
            </div>

            <!-- 진드기 예방수칙 섹션 -->
            <div class="result-box rule-box fade-in delay-1">
                <div id="rule-text" class="rule-text">
                    <!-- 예방수칙(안전비결) 내용이 들어갑니다 -->
                </div>
            </div>

            <button onclick="resetScreen()" class="btn btn-next fade-in delay-2">
                다음 사람 뽑기 🔄
            </button>
        </div>

    </div>

    <script>
        // 25종 운세 데이터 (오프라인 사용 가능)
        const fortunes = [
            { grade: "대길(大吉)", text: "밝은색 옷을 입고 나서면 맑은 기운이 깃들어 귀인이 멀리서도 알아보고 찾아옵니다!", secret: "💡 안전비결: 진드기가 잘 보이도록 밝은색 옷 입기" },
            { grade: "만사형통(萬事亨通)", text: "외출 전 향긋한 기피제를 뿌리면 삿된 기운과 나쁜 벌레가 모두 피해갑니다!", secret: "💡 안전비결: 외출 전 옷과 신발에 해충 기피제 뿌리기" },
            { grade: "무병장수(無病長壽)", text: "풀밭 대신 돗자리 위에 반듯하게 앉으시면 건강운이 상승하고 장수하십니다!", secret: "💡 안전비결: 풀밭에 바로 앉지 말고 반드시 돗자리 사용하기" },
            { grade: "길운(吉運)", text: "바짓단을 양말 속으로 단정히 여미면 재물이 새어나가지 않고 복이 쌓입니다!", secret: "💡 안전비결: 바짓단을 양말에 넣어 진드기 침투 차단" },
            { grade: "건강대길(健康大吉)", text: "외출 후 시원하게 샤워를 하시면 몸에 붙은 액운이 말끔히 씻겨 내려갑니다!", secret: "💡 안전비결: 귀가 즉시 몸 구석구석 꼼꼼하게 씻기" },
            { grade: "평안(平安)", text: "집에 들어가기 전 옷을 힘차게 털어내면 집안에 상서로운 기운이 감돕니다!", secret: "💡 안전비결: 귀가 전 옷을 꼼꼼히 털어 진드기 떼어내기" },
            { grade: "만복(萬福)", text: "긴 소매와 긴 바지로 맨살을 감추면 온갖 잡귀와 질병이 침범하지 못합니다!", secret: "💡 안전비결: 야외활동 시 긴소매, 긴바지로 피부 노출 최소화" },
            { grade: "화평(和平)", text: "사용한 돗자리를 세척해 햇볕에 바짝 말리면 집안에 양기가 가득 차고 우환이 사라집니다!", secret: "💡 안전비결: 사용한 돗자리는 털고 씻어서 햇볕에 말리기" },
            { grade: "대통(大通)", text: "길을 걸을 때 한가운데로 바르게 걸으시면 앞길이 환하게 열리고 매사 순탄합니다!", secret: "💡 안전비결: 풀숲을 피하고 탐방로(등산로) 중앙으로 걷기" },
            { grade: "청결만복(淸潔萬福)", text: "외출 후 머리를 구석구석 감으면 머리가 맑아지고 좋은 아이디어가 샘솟습니다!", secret: "💡 안전비결: 머리카락 속에 숨은 진드기 제거를 위해 꼼꼼히 머리 감기" },
            { grade: "백병소멸(百病消滅)", text: "씻을 때 몸을 찬찬히 살피면 숨어있던 작은 병마도 미리 막아낼 수 있습니다!", secret: "💡 안전비결: 목욕 시 겨드랑이, 사타구니, 귀 뒤 진드기 확인" },
            { grade: "안전대길(安全大吉)", text: "외출복을 다른 옷과 따로 빨면 나쁜 기운이 옮겨가지 않아 가정이 화목해집니다!", secret: "💡 안전비결: 야외활동복은 일상복과 분리하여 세탁하기" },
            { grade: "소원성취(所願成就)", text: "윗옷을 바지 안으로 단정하게 집어넣으면 마음이 흔들리지 않고 중심을 잡게 됩니다!", secret: "💡 안전비결: 상의를 하의에 넣어 허리 쪽 진드기 침투 방지" },
            { grade: "복덕(福德)", text: "풀밭에 옷을 함부로 벗어두지 않으면 소중한 물건을 잃어버리는 일이 없습니다!", secret: "💡 안전비결: 야외에서 겉옷을 풀밭 위에 벗어두지 않기" },
            { grade: "길운(吉運)", text: "정해진 정자나 의자에서 쉬어가시면 반가운 벗을 만나고 웃음꽃이 핍니다!", secret: "💡 안전비결: 풀숲 대신 정자나 벤치 등 지정된 휴식처 이용" },
            { grade: "대길(大吉)", text: "몸에 열이 날 때 즉시 의원을 찾으면 큰 액운을 작은 액운으로 막아냅니다!", secret: "💡 안전비결: 야외활동 후 고열이나 발진 발생 시 즉시 병원 방문" },
            { grade: "건강대길(健康大吉)", text: "팔에 토시를 덧대어 차면 든든한 방패가 생겨 어떠한 구설수도 막아냅니다!", secret: "💡 안전비결: 팔토시를 착용하여 손목과 팔 노출 방지" },
            { grade: "만사형통(萬事亨通)", text: "맨발이 보이지 않게 편안한 운동화를 신으시면 가는 길마다 든든한 귀인을 만납니다!", secret: "💡 안전비결: 슬리퍼 말고 맨살이 안 보이는 운동화 신기" },
            { grade: "평안(平安)", text: "외출 후 가방과 모자를 밖에서 탁탁 털어내면 근심 걱정이 문턱을 넘지 못합니다!", secret: "💡 안전비결: 야외에서 사용한 배낭이나 용품에 붙은 진드기 털기" },
            { grade: "만복(萬福)", text: "목에 예쁜 수건을 두르면 차가운 바람도 막아주고 따뜻한 정이 깃듭니다!", secret: "💡 안전비결: 목수건을 둘러 목덜미로 들어오는 진드기 차단" },
            { grade: "무병장수(無病長壽)", text: "가을 나들이에 발밑을 더욱 조심하고 살피면 풍성한 기쁨을 누립니다!", secret: "💡 안전비결: 진드기가 활발한 가을철(9~11월) 나들이 시 특히 주의" },
            { grade: "화평(和平)", text: "산책 다녀온 강아지를 깨끗이 보살피면 집안에 복덩이가 굴러들어옵니다!", secret: "💡 안전비결: 반려동물 산책 후 털 속에 진드기가 붙어있는지 확인" },
            { grade: "대통(大通)", text: "나무에 기대지 않고 스스로 꼿꼿이 서면 자립심이 커지고 재물이 늘어납니다!", secret: "💡 안전비결: 산이나 들에서 나무 둥치에 기대거나 기대앉지 않기" },
            { grade: "백병소멸(百病消滅)", text: "놀란 마음에 맨손으로 섣불리 건드리지 않고 차분히 대처하시면, 큰 액운이 무사히 비껴가고 평안을 누리십니다!", secret: "💡 안전비결: 진드기를 발견해도 당황하여 맨손으로 떼지 말고 꼭 병원 가기" },
            { grade: "안전대길(安全大吉)", text: "기피제를 수시로 덧발라주면 겹겹이 보호막이 쳐져 든든한 하루가 됩니다!", secret: "💡 안전비결: 해충 기피제는 3~4시간마다 추가로 뿌려 효과 유지" }
        ];

        let fortuneQueue = [];
        let lastFortune = null;

        // 배열 섞기 함수
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 중복 방지를 위한 아이템 뽑기 함수
        function getNextItem() {
            let queue = fortuneQueue;
            
            if (queue.length === 0) {
                queue = shuffleArray(fortunes);
                // 직전 마지막 아이템이 새 큐의 첫 번째와 같으면 위치 변경
                if (queue[0] === lastFortune && queue.length > 1) {
                    let temp = queue[0];
                    queue[0] = queue[1];
                    queue[1] = temp;
                }
            }

            const selectedItem = queue.pop();
            lastFortune = selectedItem;
            fortuneQueue = queue;

            return selectedItem;
        }

        // 화면 제어 변수
        const screenStart = document.getElementById('screen-start');
        const screenLoading = document.getElementById('screen-loading');
        const screenResult = document.getElementById('screen-result');
        
        const fortuneGrade = document.getElementById('fortune-grade');
        const fortuneText = document.getElementById('fortune-text');
        const ruleText = document.getElementById('rule-text');

        // 뽑기 시작 함수
        function startDrawing() {
            // 시작 화면 숨기고 로딩 화면 표시
            screenStart.classList.add('hidden');
            screenLoading.classList.remove('hidden');

            const newFortune = getNextItem();

            // 1.5초 후 결과 표시
            setTimeout(() => {
                fortuneGrade.innerHTML = `🍀 오늘의 운세: <span style="color: #dc2626;">${newFortune.grade}</span> 🍀`;
                fortuneText.innerHTML = newFortune.text;
                ruleText.innerHTML = newFortune.secret;

                screenLoading.classList.add('hidden');
                screenResult.classList.remove('hidden');
            }, 1500);
        }

        // 초기화 함수
        function resetScreen() {
            screenResult.classList.add('hidden');
            screenStart.classList.remove('hidden');
        }

        // 전체화면 토글 함수
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                // 전체화면 켜기
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) { /* Safari */
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) { /* IE11 */
                    document.documentElement.msRequestFullscreen();
                }
            } else {
                // 전체화면 끄기
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }
    </script>
</body>
